# Requests arrive through Caddy; take the visitor's address and scheme from
# what it forwards, so login rate limits see real clients, not the proxy.
map $http_x_forwarded_proto $proxied_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        # The backend checks a write's Origin against the host the browser
        # used, and counts failed logins per client address — both need the
        # real values, not the proxy's.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxied_proto;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }
}
