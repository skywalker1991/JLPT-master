    <title>日本語Master</title>
      <script>
      // Apply the saved theme before first paint (see SettingsContext)
      try {
        var t = (JSON.parse(localStorage.getItem('jlpt-settings') || '{}').theme) || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
